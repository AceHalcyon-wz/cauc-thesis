name: Compile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bachelor
            file: examples/bachelor.tex
          - name: master-academic
            file: examples/master-academic.tex
          - name: master-professional
            file: examples/master-professional.tex
          - name: doctor
            file: examples/doctor.tex
          - name: main
            file: cauc_thesis.tex

    name: Compile ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-science \
            texlive-pictures \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Prepare test file
        run: |
          cp "${{ matrix.file }}" test_compile.tex

      - name: Compile with latexmk
        run: |
          latexmk -xelatex test_compile.tex

      - name: Check PDF size
        run: |
          pdf_size=$(stat -c%s build/test_compile.pdf 2>/dev/null)
          max_size=5242880
          if [ "$pdf_size" -gt "$max_size" ]; then
            echo "::warning::PDF size exceeds 5MB ($(( pdf_size / 1024 / 1024 ))MB)"
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/test_compile.pdf
