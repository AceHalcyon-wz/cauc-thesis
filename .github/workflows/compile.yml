name: Compile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        degree: [bachelor, master-academic, master-professional, doctor]

    name: Compile ${{ matrix.degree }}

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-science \
            texlive-pictures \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Prepare test file
        run: |
          cp examples/${{ matrix.degree }}.tex test_compile.tex

      - name: Compile with latexmk
        run: |
          latexmk -xelatex test_compile.tex

      - name: Check PDF size
        run: |
          pdf_size=$(stat -c%s build/test_compile.pdf 2>/dev/null)
          max_size=5242880
          if [ "$pdf_size" -gt "$max_size" ]; then
            echo "::warning::PDF size exceeds 5MB ($(( pdf_size / 1024 / 1024 ))MB)"
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.degree }}
          path: build/test_compile.pdf
