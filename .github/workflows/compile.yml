name: Compile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-science \
            texlive-pictures \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Compile examples and main template
        run: |
          set -e
          for f in \
            examples/bachelor.tex \
            examples/master-academic.tex \
            examples/master-professional.tex \
            examples/doctor.tex \
            cauc_thesis.tex; do
            echo "::group::Compiling ${f}"
            latexmk -xelatex "${f}"
            echo "::endgroup::"
          done

      - name: Check PDF size
        run: |
          max_size=5242880
          for pdf in build/*.pdf; do
            pdf_size=$(stat -c%s "$pdf")
            echo "${pdf}: $(( pdf_size / 1024 )) KB"
            if [ "$pdf_size" -gt "$max_size" ]; then
              echo "::warning::PDF size exceeds 5MB: ${pdf}"
            fi
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdfs
          path: build/*.pdf
