name: Compile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bachelor
            degree: bachelor
            extra_options: ""
            engine: xelatex
          - name: master-academic
            degree: master-academic
            extra_options: ""
            engine: xelatex
          - name: master-professional
            degree: master-professional
            extra_options: ""
            engine: xelatex
          - name: doctor
            degree: doctor
            extra_options: ""
            engine: xelatex
          - name: bachelor-design
            degree: bachelor
            extra_options: "Type=design"
            engine: xelatex
          - name: bachelor-declaration
            degree: bachelor
            extra_options: "declaration=true"
            engine: xelatex
          - name: master-academic-twoside
            degree: master-academic
            extra_options: "twoside=true"
            engine: xelatex
          - name: master-academic-blind
            degree: master-academic
            extra_options: "blind=true"
            engine: xelatex
          - name: master-academic-draft
            degree: master-academic
            extra_options: "draft=true"
            engine: xelatex
          - name: master-academic-lineno
            degree: master-academic
            extra_options: "lineno=true"
            engine: xelatex
          - name: master-academic-systemfonts-times
            degree: master-academic
            extra_options: "mathfont=times,localfonts=false"
            engine: xelatex
          - name: doctor-lualatex
            degree: doctor
            extra_options: ""
            engine: lualatex

    name: Compile ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-luatex \
            texlive-lang-chinese \
            texlive-science \
            texlive-pictures \
            texlive-publishers \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            latexmk

      - name: Prepare test file
        env:
          EXTRA_OPTIONS: ${{ matrix.extra_options }}
        run: |
          cp examples/${{ matrix.degree }}.tex test_compile.tex
          # 将 extra_options 插入 \documentclass[ 之后，避免误匹配文档中的其他 ]
          if [ -n "$EXTRA_OPTIONS" ]; then
            EXTRA="$EXTRA_OPTIONS" perl -0pi -e 's/\\documentclass\[/\\documentclass[$ENV{EXTRA},/' test_compile.tex
          fi

      - name: Compile with latexmk
        run: |
          latexmk -${{ matrix.engine }} test_compile.tex

      - name: Check PDF size
        run: |
          pdf_size=$(stat -c%s build/test_compile.pdf 2>/dev/null)
          max_size=5242880
          if [ "$pdf_size" -gt "$max_size" ]; then
            echo "::warning::PDF size exceeds 5MB ($(( pdf_size / 1024 / 1024 ))MB)"
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/test_compile.pdf
